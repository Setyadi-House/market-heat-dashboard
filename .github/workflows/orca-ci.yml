name: ORCA CI

on:
  pull_request:
    paths:
      - "orca/**"
      - "scripts/orca_build.py"
      - "tests/**"
      - "requirements-orca.txt"
      - ".github/workflows/orca-*.yml"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-orca.txt
      - name: Install Python dependencies
        run: pip install -r requirements-orca.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build deterministic demo bundle
        run: python scripts/orca_build.py --mode demo --output /tmp/orca-dashboard.json
      - name: Validate JavaScript syntax
        run: node --check orca/app.js
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/orca-dashboard.json')
          data = json.loads(p.read_text())
          assert data['meta']['universe_count'] == 24
          assert len(data['assets']) == 24
          assert len(data['history']) > 1000
          assert data['meta']['data_mode'] == 'demo'
          print('ORCA JSON validation passed')
          PY
