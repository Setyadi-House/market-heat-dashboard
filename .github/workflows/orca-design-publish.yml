name: Publish ORCA approved-mock redesign

on:
  push:
    branches:
      - fix/orca-match-approved-mock
    paths:
      - ".orca-design.part-*"
      - ".github/workflows/orca-design-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orca-approved-mock-redesign
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: fix/orca-match-approved-mock
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-orca.txt

      - name: Decode and validate redesign archive
        run: |
          cat .orca-design.part-* | base64 --decode > /tmp/orca-design.tar.gz
          echo "693fbfed90e7cad753549de187ff05a589981bbae17277326cd8f0683d6b69de  /tmp/orca-design.tar.gz" | sha256sum --check -
          gzip --test /tmp/orca-design.tar.gz
          mkdir -p /tmp/orca-design
          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          archive = '/tmp/orca-design.tar.gz'
          required = {'index.html', 'styles.css', 'app.js'}
          with tarfile.open(archive, 'r:gz') as tar:
              members = tar.getmembers()
              names = {m.name for m in members}
              assert names == required, f'unexpected archive members: {sorted(names)}'
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute(), f'absolute path rejected: {member.name}'
                  assert '..' not in path.parts, f'path traversal rejected: {member.name}'
                  assert not member.issym() and not member.islnk(), f'link rejected: {member.name}'
              tar.extractall('/tmp/orca-design', filter='data')
          print('Validated approved-mock redesign archive')
          PY

      - name: Install dependencies and apply redesigned interface
        run: |
          pip install -r requirements-orca.txt
          cp /tmp/orca-design/index.html orca/index.html
          cp /tmp/orca-design/styles.css orca/styles.css
          cp /tmp/orca-design/app.js orca/app.js
          node --check orca/app.js
          python -m unittest discover -s tests -v

      - name: Static interface audit
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path('orca/index.html').read_text()
          css = Path('orca/styles.css').read_text()
          js = Path('orca/app.js').read_text()

          required_ids = {
              'dataModeBadge', 'kpiGrid', 'regimeMap', 'marketOutcomeChart',
              'regimeStatsBody', 'networkSvg', 'heatmapCanvas', 'assetBody',
              'assetDetailPanel', 'crashDrivers', 'rallyDrivers', 'helpPopover'
          }
          missing = [item for item in required_ids if f'id="{item}"' not in html]
          assert not missing, f'missing required interface IDs: {missing}'
          assert '.driver-score-pill' in css
          assert '.asset-role-table td{font-size:10px}' in css
          assert '#networkSvg' in css
          assert 'Composite · All estimators' in html
          assert 'performance by regime' in html.lower()
          assert '10Y' in html
          assert 'renderNetwork' in js and 'renderDrivers' in js and 'renderOutcome' in js
          assert "fetch(`data/dashboard.json" in js
          assert len(re.findall(r'<section class="card full"', html)) >= 8
          print('ORCA interface static audit passed')
          PY

      - name: Commit audited redesign files
        run: |
          if git diff --quiet -- orca/index.html orca/styles.css orca/app.js; then
            echo "No redesign changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orca/index.html orca/styles.css orca/app.js
          git commit -m "fix(orca): match approved dashboard mock"
          git push origin HEAD:fix/orca-match-approved-mock
